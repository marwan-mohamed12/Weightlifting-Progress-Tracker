<section class="page">
  <header class="mb-6">
    <a routerLink="/" class="text-sm font-semibold text-mute">Back</a>
    <h1 class="page-title mt-2">Settings</h1>
  </header>

  @if (error()) {
    <p class="banner-bad mb-4" role="alert">{{ error() }}</p>
  }
  @if (info()) {
    <p class="mb-4 rounded-[1.5rem] bg-plate/20 px-4 py-3 text-sm">{{ info() }}</p>
  }

  <label class="card mb-4 flex min-h-16 items-center justify-between gap-4">
    <span>
      <span class="block font-semibold">Personal record alerts</span>
      <span class="block text-sm text-mute">Show a summary when a set is a new best.</span>
    </span>
    <input
      class="size-5 accent-plate"
      type="checkbox"
      [checked]="notify()"
      [disabled]="loading()"
      (change)="toggle($any($event.target).checked)"
    />
  </label>

  <section class="card mb-4 grid gap-3">
    <h2 class="m-0 text-lg font-bold">Data</h2>
    <p class="m-0 text-sm text-mute">
      History lives in a local SQLite file on this machine (`backend/data`). Export keeps it portable. Restore replaces sessions and templates.
    </p>
    <div class="flex flex-wrap gap-2">
      <button type="button" class="btn" (click)="exportJson()">JSON export / backup</button>
      <button type="button" class="btn-ghost" (click)="exportCsv()">CSV export</button>
    </div>
    <label class="field">
      <span class="label-caps">Import JSON (merge)</span>
      <input class="control" type="file" accept="application/json,.json" (change)="onJsonFile($event, false)" />
    </label>
    <label class="field">
      <span class="label-caps">Restore backup (replace sessions)</span>
      <input class="control" type="file" accept="application/json,.json" (change)="onJsonFile($event, true)" />
    </label>
    <label class="field">
      <span class="label-caps">Import CSV</span>
      <input class="control" type="file" accept=".csv,text/csv" (change)="onCsvFile($event)" />
    </label>
  </section>
</section>
