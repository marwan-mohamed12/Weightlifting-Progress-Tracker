<div class="min-h-dvh bg-iron lg:grid lg:grid-cols-[240px_minmax(0,1fr)]">
  <a
    href="#main"
    class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-[80] focus:rounded-full focus:bg-plate focus:px-4 focus:py-2 focus:text-on-plate"
  >
    Skip to content
  </a>

  <aside class="hidden bg-surface lg:sticky lg:top-0 lg:flex lg:h-dvh lg:flex-col lg:px-5 lg:py-8">
    <div class="px-2 pb-10">
      <p class="text-sm font-medium text-mute">Plate</p>
      <p class="mt-1 font-display text-3xl font-bold leading-none tracking-tight">Your lifts</p>
    </div>
    <nav class="grid gap-2" aria-label="Primary">
      @for (item of items; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="is-on bg-plate text-on-plate"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          class="nav-link min-h-12 justify-start gap-3 rounded-full px-4 font-semibold"
        >
          <app-icon [name]="item.icon" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <div class="flex min-h-dvh flex-col">
    <main id="main" class="mx-auto w-full flex-1 px-4 pb-dock pt-[calc(1.25rem+env(safe-area-inset-top))] sm:px-6 lg:max-w-[960px] lg:px-8 lg:pb-10 lg:pt-8">
      <router-outlet />
    </main>
  </div>

  <div class="pointer-events-none fixed inset-x-0 bottom-0 z-40 px-5 pb-[calc(0.85rem+env(safe-area-inset-bottom))] lg:hidden">
    <nav
      class="pointer-events-auto mx-auto flex max-w-sm items-center justify-between rounded-full bg-dock p-1.5 shadow-[0_12px_40px_rgba(0,0,0,0.35)]"
      aria-label="Primary"
    >
      @for (item of items; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="is-on"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          class="dock-item"
          [attr.aria-label]="item.label"
        >
          <app-icon [name]="item.icon" />
        </a>
      }
    </nav>
  </div>

  @if (toast.message(); as message) {
    <div
      class="pointer-events-none fixed inset-x-0 top-0 z-[70] flex justify-center px-4 pt-[calc(env(safe-area-inset-top)+0.75rem)]"
      role="status"
      aria-live="polite"
    >
      <p class="pointer-events-auto flex items-center gap-2 rounded-full bg-plate px-4 py-2.5 text-sm font-semibold text-on-plate shadow-lg">
        <app-icon name="check" />
        {{ message }}
      </p>
    </div>
  }
</div>
