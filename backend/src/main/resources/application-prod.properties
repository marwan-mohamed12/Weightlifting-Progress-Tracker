# Production. Start with --spring.profiles.active=prod
spring.datasource.url=jdbc:sqlite:${PLATE_DB_PATH:data/weightlifting-prod.db}
spring.jpa.hibernate.ddl-auto=update

logging.level.com.weightlifting.tracker=INFO
logging.level.org.hibernate.SQL=WARN

spring.devtools.livereload.enabled=false
spring.devtools.restart.enabled=false

plate.cors.allowed-origin-patterns=http://localhost:4200,https://localhost,capacitor://localhost
