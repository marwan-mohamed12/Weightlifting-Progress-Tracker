# Local / development. Activated by default (spring.profiles.default=local).
spring.datasource.url=jdbc:sqlite:${PLATE_DB_PATH:data/weightlifting.db}
spring.jpa.hibernate.ddl-auto=update
server.address=0.0.0.0
plate.cors.allowed-origin-patterns=*

logging.level.com.weightlifting.tracker=DEBUG

spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true
